<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ostatnia Zmiana w Latarni</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* One full-bleed terminal: the whole page is a character grid. */
:root{
  --bg:#07090b;
  --fg:#d5d9db;
  --font-term:"VT323","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg);}
body{margin:0;overflow:hidden;}
#term{
  position:fixed;left:0;top:0;width:100%;height:100%;box-sizing:border-box;
  background:var(--bg);
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-top:max(14px, env(safe-area-inset-top,0px));
  padding-bottom:max(12px, env(safe-area-inset-bottom,0px));
  cursor:text;-webkit-tap-highlight-color:transparent;
  font-family:var(--font-term);
}
#screen{display:block;}
#cmd{
  position:absolute;left:0;top:0;width:10px;height:10px;
  opacity:0;border:0;margin:0;padding:0;background:transparent;
  color:transparent;caret-color:transparent;font-size:16px;outline:none;
}
#term::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 45%, transparent 62%, rgba(0,0,0,0.42) 100%);
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>

<div id="term">
  <canvas id="screen" aria-hidden="true"></canvas>
  <input id="cmd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Polecenie / Command">
  <div id="sr" class="sr" role="log" aria-live="polite"></div>
</div>
<script>
"use strict";
// ============================================================
//  ENGINE: an ASCII ray tracer. Every character cell is one ray.
//  The game text is a texture projected from the camera onto
//  whatever each cell's ray hits. At rest the projection is the
//  identity, so it reads as a plain terminal.
// ============================================================
const TAU = Math.PI * 2;
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
function lerpAng(a, b, t) { return a + angDiff(a, b) * t; }
function frac(x) { return x - Math.floor(x); }
function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) { return 0.55 * vnoise(x, y) + 0.3 * vnoise(x * 2.03 + 5.2, y * 2.03 + 1.3) + 0.15 * vnoise(x * 4.1 + 9.1, y * 4.1 + 3.7); }

// screen & projection (set by layout)
let COLS = 100, ROWS = 40, TEXT_ROWS = 38, FX = 50, FY = 20, GW = 8, GH = 20, TIME = 0, GLYPH = null;
let OUT_CH = new Uint16Array(0), OUT_COL = new Uint8Array(0), ROWMASK = new Uint32Array(0);
function allocBuffers() { OUT_CH = new Uint16Array(COLS * ROWS); OUT_COL = new Uint8Array(COLS * ROWS); ROWMASK = new Uint32Array(ROWS); }
// text styles: body, title, dim, echo, event, highlight
const STYLE_BASE = [0.86, 1.0, 0.6, 0.86, 0.7, 1.0];
// palette: 1..6 text greys, 7..12 scene blues, 13..15 amber, 16 green, 17 violet, 18 white
const COL_BLUE = 0, COL_AMBER = 1, COL_GREEN = 2, COL_VIOLET = 3, COL_WHITE = 4;

// ---------- world state (written by the game, read by the renderer)
const W = {
  seaY: -6.2, lamp: 0, /* 0 off, 1 oil, 2 posoka, 3 gin */ lensAng: 0.6, rot: false, flash: 0, curtain: 1,
  falseLight: true, shipX: -520, shipZ: 330, shipVis: 1, monster: 0, lightning: 0, dawn: 0,
  lampka: true, fire: true, shake: 0, smashed: false, zoom: 1, itemHi: 0
};

// materials
const M_SKY = 0, M_SEA = 1, M_WALL = 2, M_WALLOUT = 3, M_PLANK = 4, M_WOOD = 5, M_IRON = 6, M_BRASS = 7, M_GLASS = 8,
  M_LENS = 9, M_ROCK = 10, M_SAND = 11, M_CAVE = 12, M_CLOTH = 13, M_PAPER = 14, M_BRICK = 15, M_LANTERN = 16,
  M_TENT = 17, M_FEATHER = 18, M_MIRROR = 19, M_LAND = 20, M_ROOF = 21, M_BOTTLE = 22, M_CEIL = 23, M_STONE = 24;
// zones
const Z_OUT = 0, Z_IZBA = 1, Z_SHAFT = 2, Z_KOM = 3, Z_GAL = 4, Z_MAG = 5, Z_GROTA = 6;
const ID_SEA = 9001, SKY_R = 600;

const RAMP = {
  WALL: ' .:;!|lI1UB8', WALLOUT: ' .:;=+*#%', PLANK: ' .,-=~+#H', WOOD: ' .-=+#H', IRON: ' .:-=+*#', BRASS: ' .-=+*%$',
  GLASS: ' .\'":|', LENS: ' .:oO0@', ROCK: ' .:oO08@', SAND: ' .,:;=+', CAVE: ' .:;!1lI8', CLOTH: ' .,;+*%&',
  PAPER: ' .:-=+#', BRICK: ' .,:;=#H', SEA: ' .-~=~*', TENT: ' .,;oO@', FEATHER: ' .,;%&', MIRROR: ' .:|!I',
  LAND: ' .,:', ROOF: ' .-=#', BOTTLE: ' .:oO', CEIL: ' .-=+#', FIRE: ' .,:;*#%@', SKY: ' .,:;', SLIME: ' .,~=+*%',
  BLACK: ' .,:;'
};

// ---------- geometry
const TR = 4.2, Y_CEIL1 = 3.5, Y_KOM = 9.5, Y_GAL = 12.5, Y_ROOF = 15.4;
const STEP_A0 = 1.0, STEP_DA = 0.2268, STEP_DY = 0.25, N_STEPS = 38;
function stepYaw(k) { return STEP_A0 - STEP_DA * k; }
function polar(a, r) { return [Math.sin(a) * r, Math.cos(a) * r]; }
const CAVE = { x: 6.5, y: -4.5, z: -4.0, r: 4.0 };
const HATCH = { x: 7.0, z: -1.2 };
const GARB_LAMP = { x: 12.15, y: -4.72, z: -78.95 };
const FIRE_POS = (function () { const p = polar(-2.2, 3.2); return { x: p[0], y: 0.45, z: p[1] }; })();

const PR = [];
const KC = { tube: 1, cyl: 2, box: 3, hbox: 4, sph: 5, hsph: 6, disc: 7 };
const ZB = { I: 1 << Z_IZBA, S: 1 << Z_SHAFT, K: 1 << Z_KOM, G: 1 << Z_GAL, M: 1 << Z_MAG, R: 1 << Z_GROTA, O: 1 << Z_OUT };
let VZ = 127;
function vis(str) { let m = 0; for (const ch of str) m |= ZB[ch]; VZ = m; }
function add(o) {
  o.id = PR.length + 1; if (o.hidden === undefined) o.hidden = false; o.kc = KC[o.k]; if (o.vz === undefined) o.vz = VZ;
  PR.push(o); bound(o); return o;
}
function bound(o) {
  if (o.k === 'tube' || o.k === 'cyl') { o.bx = o.x; o.by = (o.y0 + o.y1) / 2; o.bz = o.z; o.br = Math.hypot(o.r, (o.y1 - o.y0) / 2); }
  else if (o.k === 'box' || o.k === 'hbox') { o.c = Math.cos(o.rot || 0); o.s = Math.sin(o.rot || 0); o.bx = o.x; o.by = o.y; o.bz = o.z; o.br = Math.hypot(o.hx, o.hy, o.hz); }
  else if (o.k === 'sph' || o.k === 'hsph') { o.bx = o.x; o.by = o.y; o.bz = o.z; o.br = o.r; }
  else if (o.k === 'disc') { o.bx = o.x; o.by = o.y; o.bz = o.z; o.br = o.r1; }
}
function boxAt(a, r, y, hx, hy, hz, mat, extra) {
  const p = polar(a, r);
  return add(Object.assign({ k: 'box', x: p[0], y: y, z: p[1], hx: hx, hy: hy, hz: hz, rot: a, mat: mat }, extra || {}));
}
function setBox(o, x, y, z, hx, hy, hz, rot) { o.x = x; o.y = y; o.z = z; o.hx = hx; o.hy = hy; o.hz = hz; if (rot !== undefined) o.rot = rot; bound(o); }

// pass-through predicates
function glassPass(p, ang, y) {
  if (y < p.y0 + 0.35 || y > p.y1 - 0.25) return false;
  const m = frac(ang / (TAU / 8));
  if (m < 0.014 || m > 0.986) return false;
  const col = Math.floor(ang * 55);
  return hash2(col, Math.floor(y * 7 + TIME * 4 + hash2(col, 7) * 13)) > 0.07;
}
function railPass(p, ang, y) {
  if (y > p.y1 - 0.07) return false;
  if (Math.abs(y - (p.y0 + 0.55)) < 0.03) return false;
  const m = frac(ang / (TAU / 48));
  return !(m < 0.03);
}
function windowPass(p, lx, ly, lz) {
  if (Math.abs(lx) < 0.035 || Math.abs(ly) < 0.035 || Math.abs(lx) > p.hx - 0.05 || Math.abs(ly) > p.hy - 0.05) return false;
  const col = Math.floor(lx * 30);
  return hash2(col + 40, Math.floor(ly * 9 + TIME * 3 + hash2(col, 3) * 11)) > 0.08;
}
function barsPass(p, lx, ly, lz) {
  if (Math.abs(ly) > p.hy - 0.08) return false;
  return frac((lz + 10) / 0.13) > 0.26;
}
function caveOpen(x, y, z) {
  if (Math.hypot(x, z) > 9.7 && y < -2.3) return true;
  if (Math.abs(x - HATCH.x) < 0.46 && Math.abs(z - HATCH.z) < 0.46 && y > -2.6) return true;
  return false;
}

const G = {}; // handles to dynamic primitives
function buildWorld() {
  PR.length = 0;
  // --- island
  vis('OGRIM');
  add({ k: 'disc', x: 0, z: 0, y: -0.02, r0: 0, r1: 10, mat: M_ROCK, tag: 'islandTop', holes: [{ rect: 1, x0: HATCH.x - 0.45, x1: HATCH.x + 0.45, z0: HATCH.z - 0.45, z1: HATCH.z + 0.45 }] });
  add({ k: 'tube', x: 0, z: 0, r: 10, y0: -7.5, y1: -0.02, mat: M_ROCK, tag: 'cliff', holes: [{ a: 2.12, w: 0.5, y0: -7.5, y1: -2.35 }] });
  [[-1.5, -0.3, -9.6, 0.6], [1.8, -0.2, -9.75, 0.5], [3.6, -0.4, -9.1, 0.7], [-3.4, -0.3, -9.2, 0.55], [-6.5, -0.3, -7.3, 0.6], [6.2, -0.35, -7.6, 0.5]]
    .forEach(function (r) { add({ k: 'sph', x: r[0], y: r[1], z: r[2], r: r[3], mat: M_ROCK }); });
  for (let i = 0; i < 9; i++) {
    const a = i * TAU / 9 + 0.3; if (Math.abs(angDiff(a, 2.12)) < 0.5) continue;
    const p = polar(a, 10.6 + hash2(i, 3) * 1.5);
    add({ k: 'sph', x: p[0], y: -6.6, z: p[1], r: 1.2 + hash2(i, 9) * 1.1, mat: M_ROCK });
  }
  // --- tower
  vis('ISKGMRO');
  add({ k: 'tube', x: 0, z: 0, r: TR, y0: 0, y1: Y_GAL, mat: M_WALL, matOut: M_WALLOUT, tag: 'tower', holes: [
    { a: Math.PI / 2, w: 0.2, y0: -1, y1: 2.15 }, { a: Math.PI, w: 0.2, y0: -1, y1: 2.15 },
    { a: -1.35, w: 0.17, y0: 1.15, y1: 2.15 }, { a: 2.78, w: 0.05, y0: 5.4, y1: 6.4 },
    { a: -0.2, w: 0.05, y0: 7.0, y1: 8.0 }, { a: 1.6, w: 0.06, y0: 10.3, y1: 11.3 }] });
  vis('ISMO'); add({ k: 'disc', x: 0, z: 0, y: 0, r0: 0, r1: TR + 0.02, mat: M_PLANK, tag: 'izbaFloor' });
  vis('IS'); add({ k: 'disc', x: 0, z: 0, y: Y_CEIL1, r0: 0, r1: TR + 0.02, mat: M_PLANK, matUnder: M_CEIL, holes: [{ a: -1.65, w: 1.35, r0: 2.6, r1: 4.4 }] });
  vis('SK'); add({ k: 'disc', x: 0, z: 0, y: Y_KOM, r0: 0, r1: TR + 0.02, mat: M_PLANK, matUnder: M_CEIL, tag: 'komFloor', holes: [{ a: -0.45, w: 0.9, r0: 2.6, r1: 4.4 }] });
  vis('KGO'); add({ k: 'disc', x: 0, z: 0, y: Y_GAL, r0: 0, r1: 4.85, mat: M_IRON, matUnder: M_CEIL, tag: 'galFloor', holes: [{ rect: 1, x0: 1.8, x1: 2.6, z0: -1.45, z1: -0.6 }] });
  vis('GO'); add({ k: 'tube', x: 0, z: 0, r: 3.0, y0: Y_GAL, y1: Y_ROOF, mat: M_GLASS, pass: glassPass, tag: 'glass' });
  add({ k: 'tube', x: 0, z: 0, r: 4.8, y0: Y_GAL, y1: Y_GAL + 1.1, mat: M_IRON, pass: railPass });
  add({ k: 'disc', x: 0, z: 0, y: Y_ROOF, r0: 0, r1: 3.35, mat: M_ROOF, matUnder: M_ROOF });
  add({ k: 'cyl', x: 0, z: 0, r: 0.7, y0: Y_ROOF, y1: Y_ROOF + 0.7, mat: M_ROOF, capT: 1 });
  add({ k: 'sph', x: 0, y: Y_ROOF + 1.05, z: 0, r: 0.35, mat: M_ROOF });
  // stairs
  vis('ISK');
  G.steps = [];
  for (let k = 0; k < N_STEPS; k++) { vis(k <= 15 ? 'IS' : (k <= 25 ? 'S' : 'SK')); G.steps.push(boxAt(stepYaw(k), 3.5, STEP_DY * (k + 1) - 0.05, 0.4, 0.05, 0.65, M_IRON, { tag: 'step' })); }
  // --- izba
  vis('ISMO');
  // fireplace, mantel, chimney, hooks
  boxAt(-2.2, 3.85, 0.65, 0.75, 0.65, 0.35, M_BRICK, { tag: 'fireplace' });
  boxAt(-2.2, 3.78, 1.36, 0.85, 0.06, 0.42, M_WOOD);
  boxAt(-2.2, 3.98, 2.42, 0.42, 1.06, 0.2, M_BRICK);
  boxAt(-2.32, 4.12, 1.78, 0.03, 0.03, 0.08, M_IRON); boxAt(-2.08, 4.12, 1.78, 0.03, 0.03, 0.08, M_IRON);
  G.matches = boxAt(-2.36, 3.62, 1.455, 0.09, 0.035, 0.055, M_PAPER, { tag: 'matches', item: 1 });
  { const p = polar(-2.15, 3.35); G.poker = add({ k: 'cyl', x: p[0], z: p[1], r: 0.032, y0: 0, y1: 0.9, mat: M_IRON, capT: 1, item: 1 }); }
  // bunks
  G.bunkMine = boxAt(2.55, 3.72, 0.45, 0.85, 0.25, 0.42, M_CLOTH, { tag: 'bunk' });
  { const c = polar(2.55, 3.72), tx = Math.cos(2.55), tz = -Math.sin(2.55);
    G.biscuit = add({ k: 'box', x: c[0] + tx * 0.55, y: 0.72, z: c[1] + tz * 0.55, hx: 0.09, hy: 0.02, hz: 0.09, rot: 0.4, mat: M_PAPER, item: 1 }); }
  G.bunkRoman = boxAt(-1.78, 3.72, 0.45, 0.85, 0.25, 0.42, M_CLOTH, { tag: 'bunk' });
  G.bunkW = boxAt(-2.68, 3.72, 0.45, 0.85, 0.25, 0.42, M_CLOTH, { tag: 'bunkNeat' });
  G.chestW = boxAt(-2.68, 2.95, 0.24, 0.4, 0.24, 0.26, M_WOOD, { tag: 'chest' });
  G.padlock = boxAt(-2.68, 2.67, 0.32, 0.045, 0.055, 0.02, M_BRASS);
  G.lidW = boxAt(-2.68, 3.23, 0.72, 0.4, 0.24, 0.025, M_WOOD, { hidden: true });
  { const c = polar(-2.68, 2.95), tx = Math.cos(-2.68), tz = -Math.sin(-2.68);
    G.vial = add({ k: 'cyl', x: c[0] - tx * 0.2, z: c[1] - tz * 0.2, r: 0.035, y0: 0.48, y1: 0.62, mat: M_BOTTLE, capT: 1, hidden: true, item: 1 });
    G.letterP = add({ k: 'box', x: c[0] + tx * 0.02, y: 0.49, z: c[1] + tz * 0.02, hx: 0.11, hy: 0.008, hz: 0.08, rot: -2.4, mat: M_PAPER, hidden: true, item: 1 });
    G.timetable = add({ k: 'box', x: c[0] + tx * 0.24, y: 0.49, z: c[1] + tz * 0.24, hx: 0.1, hy: 0.008, hz: 0.13, rot: -2.9, mat: M_PAPER, hidden: true, item: 1 }); }
  { const p = polar(-2.05, 3.15); G.gin = add({ k: 'cyl', x: p[0], z: p[1], r: 0.06, y0: 0, y1: 0.36, mat: M_BOTTLE, capT: 1, item: 1 }); }
  // table + things on it
  add({ k: 'box', x: 0, y: 0.74, z: 0.55, hx: 0.65, hy: 0.03, hz: 0.42, rot: 0, mat: M_WOOD, tag: 'table' });
  [[0.58, 0.91], [-0.58, 0.91], [0.58, 0.19], [-0.58, 0.19]].forEach(function (l) { add({ k: 'cyl', x: l[0], z: l[1], r: 0.03, y0: 0, y1: 0.72, mat: M_WOOD }); });
  add({ k: 'box', x: 0.15, y: 0.785, z: 0.5, hx: 0.16, hy: 0.015, hz: 0.11, rot: 0.2, mat: M_PAPER, tag: 'logbook' });
  add({ k: 'cyl', x: -0.3, z: 0.6, r: 0.045, y0: 0.77, y1: 0.87, mat: M_IRON, capT: 1 });
  // shelf, radio, clock, mirror, rota, nail
  boxAt(2.05, 3.98, 0.95, 0.5, 0.95, 0.2, M_WOOD, { tag: 'regal' });
  boxAt(2.05, 3.68, 1.12, 0.22, 0.13, 0.12, M_WOOD, { tag: 'radio' });
  boxAt(2.05, 4.15, 2.4, 0.17, 0.17, 0.03, M_BRASS, { tag: 'clock' });
  boxAt(2.55, 4.15, 1.6, 0.22, 0.28, 0.02, M_MIRROR, { tag: 'mirror' });
  boxAt(-1.0, 4.17, 1.45, 0.14, 0.19, 0.01, M_PAPER, { tag: 'rota' });
  boxAt(1.27, 4.16, 1.55, 0.012, 0.012, 0.035, M_IRON);
  // grate at the foot of the stairs
  G.grate = boxAt(1.12, 3.5, 1.1, 0.03, 1.1, 0.68, M_IRON, { pass: barsPass, thin: 1, tag: 'grate' });
  // closet under the stairs with Roman, and the gun barrel
  G.closet = boxAt(-0.45, 3.6, 0.73, 1.0, 0.73, 0.55, M_WOOD, { tag: 'closet' });
  G.barrel = boxAt(-0.45, 2.88, 0.95, 0.025, 0.025, 0.2, M_IRON);
  // west window, sill, raven, nest, fuse
  boxAt(-1.35, 4.21, 1.65, 0.7, 0.5, 0.02, M_GLASS, { pass: windowPass, thin: 1, tag: 'window' });
  boxAt(-1.35, 4.5, 1.11, 0.78, 0.04, 0.3, M_STONE);
  { const p = polar(-1.43, 4.55); G.raven = add({ k: 'sph', x: p[0], y: 1.33, z: p[1], r: 0.13, mat: M_FEATHER, lit: 0.4 }); }
  { const p = polar(-1.43, 4.47); G.ravenHead = add({ k: 'sph', x: p[0], y: 1.49, z: p[1], r: 0.075, mat: M_FEATHER, lit: 0.4 }); }
  { const p = polar(-1.24, 4.6); G.nest = add({ k: 'sph', x: p[0], y: 1.2, z: p[1], r: 0.17, mat: M_WOOD, tag: 'nest', lit: 0.22 }); }
  { const p = polar(-1.24, 4.52); G.fuse = add({ k: 'box', x: p[0], y: 1.385, z: p[1], hx: 0.06, hy: 0.02, hz: 0.025, rot: 0.5, mat: M_BRASS, lit: 0.45, item: 1 }); }
  // --- annex: storeroom
  vis('MIOG');
  add({ k: 'hbox', x: 6.65, y: 1.4, z: 0, hx: 2.4, hy: 1.4, hz: 2.5, rot: 0, mat: M_WALL, matOut: M_WALLOUT, tag: 'annex', holes: [
    { f: 0, u0: -0.5, u1: 0.5, v0: -1.5, v1: 0.75 },

      let a = ['Kamienny kominek, żar ledwie się tli. W nadprożu wyryto po niemiecku: ERBAUT 1884. Latarnię zbudowali jeszcze Prusacy.', 'A stone fireplace, the embers barely glowing. Carved into the lintel, in German: ERBAUT 1884. The Prussians built this lighthouse.'];
      if (!has('zapalki')) a = [a[0] + ' Na gzymsie leżą zapałki.', a[1] + ' A box of matches lies on the mantel.'];
      if (!has('pogrzebacz')) a = [a[0] + ' O kominek oparty jest pogrzebacz.', a[1] + ' A poker leans against it.'];
      return [a[0] + ' Nad gzymsem wiszą dwa puste haki.', a[1] + ' Two empty hooks hang above the mantel.'];
    } },
  zapalki: { room: 'izba', kw: ['zapalk', 'zapalek', 'match', 'pudelk'], take: true, pos: [-2.55, 1.47, -2.57], g: { approach: 0.45, dip: -0.35 }, name: ['zapałki', 'matches'],
    ex: () => ['Pudełko zapałek. Zostało kilkanaście.', 'A box of matches. A dozen or so left.'], takeMsg: ['Bierzesz pudełko zapałek.', 'You take the box of matches.'] },
  pogrzebacz: { room: 'izba', kw: ['pogrzebacz', 'poker'], take: true, pos: [-2.8, 0.55, -1.84], g: { approach: 0.4, dip: 0.2 }, name: ['pogrzebacz', 'poker'],
    ex: () => F('pokerHot') ? ['Pogrzebacz, rozgrzany do czerwoności.', 'The poker, heated red-hot.'] : ['Ciężki żelazny pogrzebacz. Dobry do podważania.', 'A heavy iron poker. Good for prying.'],
    takeMsg: ['Bierzesz pogrzebacz. Ciężki, żelazny, dobry do podważania.', 'You take the poker. Heavy iron, good for prying.'] },
  haki: { room: 'izba', kw: ['hak', 'uchwyt', 'hook', 'bracket', 'harpunic sciana'], pos: [-3.33, 1.78, -2.42], g: { approach: 0.4 },
    ex: () => ['Dwa puste haki nad kominkiem. Zawsze wisiała na nich harpunica Romana, nabita jednym harpunem. Pamiątka z czasów, gdy pływał na wielorybnikach.', "Two empty hooks above the mantel. Roman's harpoon gun always hung here, loaded with its single harpoon. A keepsake from his whaling days."] },
  zegar: { room: 'izba', kw: ['zegar', 'clock', 'godzin', 'time', 'czas'], pos: [3.68, 2.4, -1.91], g: { approach: 0.35 },

  grafik: { room: 'izba', kw: ['grafik', 'rota', 'roster'], pos: [-3.51, 1.45, 2.25], g: { approach: 0.45 },

  krata: { room: 'izba', kw: ['krat', 'grate', 'gate', 'bars', 'schod', 'stair', 'gwozdz', 'nail', 'pret'], pos: [3.15, 1.2, 1.53], g: { approach: 0.4 },
    ex: () => F('grateOpen') ? ['Krata stoi otworem. Schody prowadzą na górę.', 'The grate stands open. The stairs lead up.'] : ['Żelazna krata u stóp schodów, zamknięta na klucz. Gwóźdź obok, na którym zawsze wisi klucz wachtowy, jest pusty.', 'An iron grate at the foot of the stairs, locked. The nail beside it, where the watch key always hangs, is empty.'] },
  schowek: { room: 'izba', kw: ['schowek', 'schowk', 'barykad', 'desk', 'closet', 'barricade', 'plank', 'szczelin', 'gap', 'drzwicz'], pos: [-1.57, 0.9, 3.24], g: { approach: 0.35 },
    vis: () => !F('romanAlly'),
    ex: () => F('romanTrust') ? ['Roman patrzy na ciebie przez szczelinę między deskami. Już w ciebie nie celuje. Spod desek wystają czubki jego filcowych butów.', 'Roman watches you through the gap between the planks. He is no longer aiming at you. The toes of his felt boots stick out under the planks.']
      : ['Drewniany schowek pod schodami. Roman zaparł drzwiczki od środka, nie drgną. W szczelinie między deskami widać wylot lufy harpunicy, wycelowany prosto w ciebie. Spod desek wystają czubki filcowych butów. Siedzi tam Roman.', "The wooden closet under the stairs. Roman has wedged the door shut from inside; it won't budge. Through the gap between the planks you see the muzzle of a harpoon gun aimed straight at you. The toes of felt boots stick out under the planks. Roman is in there."] },
  roman: { room: 'izba', kw: ['roman', 'keeper', 'latarnik', 'starzec', 'old man'], pos: [-1.57, 0.9, 3.24], g: { approach: 0.35 },
    vis: () => !F('romanAlly'),
    ex: () => F('romanMet') ? OBJ.schowek.ex() : ['Romana nigdzie nie widać. Jego koja przy kominku jest pusta, pościel zmięta.', 'Roman is nowhere to be seen. His bunk by the fireplace is empty, the sheets crumpled.'] },
  harpunica: { room: 'izba', kw: ['harpunic', 'lufa', 'luf', 'harpoon gun', 'gun', 'muzzle', 'bron'], pos: [-1.25, 0.95, 2.59], g: { approach: 0.35 },
    vis: () => F('romanMet') && !F('romanAlly'),
    ex: () => F('harpoonSeen') ? ['Wylot lufy w szczelinie. Harpun, który powinien w niej tkwić, widziałeś w zębatkach na górze. Ta harpunica jest pusta. Roman blefuje.', "The muzzle in the gap. The harpoon that should be loaded in it is the one you saw jammed in the gears upstairs. This gun is empty. Roman is bluffing."]
      : ['W ciemnej szczelinie widzisz tylko wylot lufy, wycelowany w ciebie.', 'In the dark gap you can see only the muzzle, aimed at you.'] },
  lampka: { room: '*', kw: ['lampk', 'latark', 'hand lamp', 'handlamp', 'my lamp', 'oil lamp', 'torch'], name: ['lampka', 'hand lamp'],
    ex: () => ['Twoja lampka naftowa. Daje tyle światła, żeby nie potknąć się o własne nogi.', "Your little oil lamp. Enough light not to trip over your own feet."] },
  drzwi: { room: 'izba', kw: ['drzwi', 'door'], ex: () => ['Drzwi na południe prowadzą na klif, drzwi na wschód do magazynu.', 'The south door leads out to the clifftop, the east door to the storeroom.'] },
  romanG: { room: 'galeria', kw: ['roman', 'latarnik', 'keeper', 'starzec', 'old man', 'harpunic', 'gun'], pos: [-1.6, 13.0, 2.2], g: { approach: 0.2 },
    vis: () => F('romanAlly'), ex: () => ['Roman siedzi pod ścianą, z naładowaną harpunicą na kolanach. Nie spuszcza oczu z szyb.', 'Roman sits against the wall with the loaded harpoon gun across his knees. He never takes his eyes off the glass.'] },
  // --- storeroom
  beczki: { room: 'magazyn', kw: ['beczk', 'beczek', 'barrel', 'naft', 'kerosene'], pos: [6.3, 0.5, 1.9], g: { approach: 0.45 },

  kanister: { room: 'magazyn', kw: ['kanister', 'kanistr', 'olej', 'oil', 'canister', 'can', 'tran', 'whale'], take: true, pos: [7.25, 0.3, 1.6], g: { approach: 0.45, dip: 0.3 }, name: ['kanister oleju', 'can of oil'],
    vis: () => F('canFound') && !F('oilGone'), ex: () => ['Ciężki kanister pełen oleju wielorybiego. Roman nie ufa nafcie.', "A heavy can full of whale oil. Roman doesn't trust kerosene."],
    takeMsg: ['Bierzesz kanister. Jest ciężki, pełen oleju wielorybiego.', "You take the can. It's heavy, full of whale oil."] },
  kuferR: { room: 'magazyn', kw: ['kufer', 'kufr', 'skrzyni', 'chest', 'zamek', 'lock', 'szyfr', 'combination', 'dial', 'kufer roman'], pos: [8.55, 0.4, 0.6], g: { approach: 0.5, dip: 0.3 },
    ex: () => F('chestROpen') ? (has('posoka') || F('posokaUsed') ? ['Otwarty kufer Romana. Pusty, tylko trociny.', "Roman's open chest. Empty but for sawdust."] : ['Otwarty kufer Romana. W trocinach leży gruba butla z czarnym płynem.', "Roman's open chest. A thick bottle of black liquid lies in the sawdust."])

  posoka: { room: 'magazyn', kw: ['posok', 'butl', 'czarn', 'ichor', 'black', 'krew', 'blood', 'butelk czarn', 'bottl black', 'black liquid', 'czarn plyn', 'butl czarn'], take: true, pos: [8.5, 0.8, 0.6], g: { approach: 0.5, dip: 0.3 }, name: ['butla Posoki', 'bottle of black ichor'],
    vis: () => F('chestROpen') && !F('posokaUsed'), ex: () => ['Gruba butla z czarnym, gęstym płynem. Jest ciepła, jakby coś w niej żyło.', 'A thick bottle of black, viscous liquid. It is warm, as if something in it were alive.'],
    takeMsg: ['Bierzesz butlę. Płyn w środku jest czarny i gęsty. Butla jest ciepła.', 'You take the bottle. The liquid inside is black and thick. The bottle is warm.'] },
  klapa: { room: 'magazyn', kw: ['klap', 'luk', 'hatch', 'trapdoor', 'trap door', 'drabin', 'ladder'], pos: [7.0, 0.05, -1.2], g: { approach: 0.45, dip: 0.2 },
    ex: () => F('hatchOpen') ? ['Otwarta klapa. Drabina prowadzi w dół, do groty. Z dołu bije zimny, słony przeciąg.', 'The open hatch. A ladder leads down to the cave. A cold, salty draught rises from below.'] : ['Drewniana klapa w podłodze, prowadzi do groty. Wokół niej kałuża śluzu. Na ścianie obok wisi pusty hak.', 'A wooden hatch in the floor, leading down to the cave. A puddle of slime surrounds it. An empty hook hangs on the wall nearby.'] },
  hak: { room: 'magazyn', kw: ['hak', 'hook'], pos: [9.0, 1.75, -1.2], g: { approach: 0.4 },
    ex: () => ['Pusty hak przy klapie. Zawsze wisiała na nim latarnia sztormowa, żeby było czym poświecić na drabinie.', 'An empty hook by the hatch. A storm lantern always hung here, for light on the ladder.'] },
  sluz: { room: 'magazyn', kw: ['sluz', 'kaluz', 'slime', 'puddle', 'minog', 'cos', 'lamprey', 'creature', 'stwor'], pos: [7.55, 0.02, -0.55], g: { approach: 0.5, dip: 0.4 },
    ex: () => (!has('klucz') && !F('keyUsed')) ? ['Gęsty, połyskliwy śluz, jakby coś wypełzło tu z dołu. W kałuży leży mosiężny klucz. Obok niego drga coś długiego i śliskiego, z okrągłą paszczą pełną zębów. Lepiej nie wkładać tam ręki. Śluz powoli spływa do kratki odpływu w rogu.', 'Thick, glistening slime, as if something crawled up from below. A brass key lies in the puddle. Beside it something long and slick twitches, with a round mouth full of teeth. Better not put your hand in there. The slime is slowly running into a drain grate in the corner.']
      : ['Gęsty, połyskliwy śluz. Coś w nim drga. Śluz powoli spływa do kratki odpływu w rogu.', 'Thick, glistening slime. Something in it twitches. The slime is slowly running into a drain grate in the corner.'] },
  klucz: { room: 'magazyn', kw: ['klucz', 'key', 'mosiezn', 'brass', 'glint', 'blyszcz', 'shiny'], take: true, listHidden: true, pos: [7.55, 0.02, -0.55], g: { approach: 0.5, dip: 0.4 }, name: ['klucz wachtowy', 'watch key'],
    vis: () => !F('keyUsed'), ex: () => has('klucz') ? ['Mosiężny klucz z wybitym napisem WACHTA. Klucz do kraty, który zawsze wisi na gwoździu w izbie. Ten, kto zamknął kratę, zgubił go przy klapie.', "A brass key stamped WACHTA. The key to the grate, the one that always hangs on the nail in the keepers' room. Whoever locked the grate dropped it by the hatch."] : ['W śluzie leży mosiężny klucz. Obok niego coś drga.', 'A brass key lies in the slime. Something twitches beside it.'] },
  kluczR: { room: 'none', kw: ['klucz', 'key', 'rzemyk', 'thong'], name: ['klucz Romana', "Roman's key"],
    ex: () => ['Mosiężny klucz do kraty na wytartym rzemyku. Jeszcze ciepły od szyi Romana.', "A brass key to the grate on a worn leather thong. Still warm from Roman's neck."] },
  odplyw: { room: 'magazyn', kw: ['odplyw', 'kratk', 'drain', 'sciek', 'podlog', 'floor', 'posadzk', 'magazyn', 'pomieszcz', 'pokoj', 'room', 'kat', 'corner', 'rog', 'cos odplyw', 'cos kratk', 'something drain', 'something grate'], pos: [6.3, 0.05, -1.9], g: { approach: 0.5, dip: 0.4 },
    ex: () => {
      if (has('butelka')) return ['Kratka odpływu w kamiennej podłodze. Pusta.', 'The drain grate in the stone floor. Empty now.'];
      if (F('bottleSeen')) return ['W kratce odpływu utknęła zakorkowana butelka.', 'A corked bottle is stuck in the drain grate.'];
      if (F('drainThing')) { S.f.bottleSeen = true; return ['Nachylasz się nad kratką. To szyjka butelki, zaklinowana między prętami.', "You bend over the grate. It's the neck of a bottle, wedged between the bars."]; }
      S.f.drainThing = true; return ['W rogu kamiennej podłogi jest kratka odpływu. Coś w niej utknęło.', 'In the corner of the stone floor there is a drain grate. Something is stuck in it.'];
    } },
  butelka: { room: 'magazyn', kw: ['butelk', 'bottle', 'kartk', 'note', 'message', 'wiadomosc', 'szyjk', 'neck', 'bottl note', 'butelk kartk', 'bottl message', 'butelk wiadomosc'], take: true, listHidden: true, vis: () => F('drainThing') || has('butelka'), pos: [6.3, 0.05, -1.9], g: { approach: 0.5, dip: 0.4 }, name: ['butelka z kartką', 'bottle with a note'],
    ex: () => ['Zakorkowana butelka po tanim winie, zaklinowana w kratce odpływu. W środku zwinięta kartka.', 'A corked bottle of cheap wine, wedged in the drain grate. A rolled-up note inside.'],
    read: () => has('butelka') ? ['Na kartce koślawe litery: CTHULHU CIĘ WIDZI.', 'Crooked letters on the note: CTHULHU SEES YOU.'] : ['Kartka jest zwinięta w zakorkowanej butelce. Najpierw musisz ją wyciągnąć.', 'The note is rolled up inside the corked bottle. You have to get it out first.'], takeMsg: ['Wyciągasz z kratki odpływu zakorkowaną butelkę po tanim winie. W środku jest zwinięta kartka.', 'You work a corked bottle of cheap wine out of the drain grate. There is a rolled-up note inside.'] },
  // --- cave
  slady: { room: 'grota', kw: ['slad', 'odcisk', 'piasek', 'piask', 'footprint', 'print', 'track', 'sand', 'bootprint'], pos: [8.0, -5.6, -4.6], g: { approach: 0.45, dip: 0.3 },

  ryty: { room: 'grota', kw: ['ryt', 'rysun', 'scian', 'znak', 'sign', 'carving', 'wall', 'symbol', 'kolo', 'circle'], pos: [3.22, -4.3, -1.89], g: { approach: 0.45 },

  wodaG: { room: 'grota', kw: ['wod', 'morz', 'fal', 'sea', 'water', 'wave', 'wylot', 'mouth'], pos: [10.5, -5.6, -7.5], g: { approach: 0.2 }, ex: () => [tideLine(), tideLine()] },

  sklepienie: { room: 'grota', kw: ['grot', 'cave', 'sklepien', 'vault', 'przystan', 'landing', 'sufit', 'ceiling'], pos: [6.5, -1.5, -4.0], g: { approach: 0 },

  drabinaG: { room: 'grota', kw: ['drabin', 'ladder', 'klap', 'hatch'], pos: [7.0, -3.0, -0.8], g: { approach: 0.3 }, ex: () => ['Drabina prowadzi w górę, do klapy w magazynie.', 'The ladder leads up to the hatch in the storeroom.'] },
  // --- the Hump
  latarnia: { room: 'garb', kw: ['latarni', 'latarn', 'lamp', 'swiatl', 'light', 'lantern', 'sztormow', 'knot', 'wick'], take: true, pos: [12.15, -4.72, -78.95], g: { approach: 0.45, dip: 0.3 }, name: ['latarnia sztormowa', 'storm lantern'],
    ex: () => W.falseLight ? ['Latarnia sztormowa, taka sama jak ta, która wisiała na haku w magazynie. Ktoś wcisnął ją w szczelinę i obłożył kamieniami, żeby deszcz jej nie zgasił i żeby była widoczna z morza. Nie błyska. Z daleka, w ulewie, wygląda jak latarnia morska.', 'A storm lantern, just like the one that hung on the hook in the storeroom. Someone has wedged it into the crevice and stacked stones around it so the rain cannot put it out and it shows to seaward. It does not flash. From far off, in the rain, it would pass for a lighthouse.']

  sladyG: { room: 'garb', kw: ['slad', 'odcisk', 'footprint', 'print', 'track', 'bootprint'], pos: [11.5, -5.7, -90], g: { approach: 0.2, dip: 0.3 }, ex: () => ['Ślady butów z ćwiekami biegną dalej groblą, w stronę lądu.', 'Hobnailed bootprints run on along the causeway, toward the mainland.'] },

  wodaR: { room: 'garb', kw: ['wod', 'morz', 'fal', 'sea', 'water', 'wave', 'grobl', 'causeway'], pos: [9.5, -6, -77], g: { approach: 0 }, ex: () => [tideLine(), tideLine()] },

  mechanizm: { room: 'komora', kw: ['mechanizm', 'zebat', 'kolo', 'kol', 'zebnik', 'gear', 'mechanism', 'clockwork', 'wheel', 'pinion'], pos: [0.8, 10.5, 0.2], g: { approach: 0.35 },
    ex: () => F('harpoonInGears') ? (S.f.harpoonSeen = true, ['Mechanizm obrotu stoi. Między wielkie koło a zębnik ktoś wbił harpun, aż zgrzytnęło żelazo. Na tarczy zegara mechanizmu wskazówki zatrzymały się na 23:40.', 'The rotation clockwork has stopped. Someone has rammed a harpoon between the great wheel and the pinion, iron grinding on iron. On the clockwork dial, the hands stopped at 23:40.'])

function scopeText(naked) {
  const pl = [], en = [];

    if (naked) { pl.push('Na południu, nisko nad wodą, pali się małe, nieruchome światło na Garbie.'); en.push('To the south, low over the water, a small steady light burns on the Hump.'); }
    else { pl.push('Przez lunetę: na Garbie, w szczelinie między głazami, stoi zwykła latarnia sztormowa. To nie jest latarnia morska. Ktoś ją tam postawił.'); en.push('Through the telescope: on the Hump, in a crevice between the rocks, stands an ordinary storm lantern. It is no lighthouse. Someone put it there.'); }
  } else { pl.push('Grobla na południu jest ciemna.'); en.push('The causeway to the south is dark.'); }

  else { pl.push(naked ? 'Na północnym zachodzie mrugają światła statku.' : 'Na północnym zachodzie parowiec, światła na maszcie i burcie. Idzie prosto, jakby kapitan był pewny swego.'); en.push(naked ? "To the north-west, a ship's lights are blinking." : 'To the north-west, a steamer, lights at masthead and side. She is coming on straight, as if her captain were sure of himself.'); }
  if (S.turn >= 16 && !naked) { pl.push('Pod klifem, w pianie, przesuwa się coś ogromnego.'); en.push('Below the cliff, in the foam, something enormous is moving.'); }
  return [pl.join(' '), en.join(' ')];
}

function norm(s) {
  s = s.toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '');
  s = s.replace(/[^a-z0-9?.\-\s']/g, ' ').replace(/'s\b/g, 's').replace(/'/g, '');
  s = s.replace(/\b(w|na|do) (gore|gorze|gora)\b/g, 'gore').replace(/\b(w|na|do) (dol|dolu)\b/g, 'dol');
  return s.replace(/\s+/g, ' ').trim();
}

function useCmd(tk, rest) {

    }

function endGame(id, variant) {

function endingCine(id, variant, entries, done) {

  if (id === 'wilk' && variant === 'klif') return Object.assign(base, { T: 4.5, bakeAt: 0.7,
    pose: function (u, p0, c) { const a = easeIO(clamp(u / 0.35, 0, 1)), b = easeIO(clamp((u - 0.35) / 0.5, 0, 1)); c.x = lerp(p0.x, 0.8, a); c.z = lerp(p0.z, lerp(-9.7, -12.0, b), a); c.y = lerp(p0.y, -7.4, b); c.yaw = lerpAng(p0.yaw, Math.PI, a); c.pitch = lerp(lerp(p0.pitch, -0.6, a), -1.35, b); },

  if (id === 'wilk' || id === 'dziedzictwo') return Object.assign(base, { T: 4.8, bakeAt: 0.7,

    shade: function (u) { return sstep(0.02, 0.15, u) * (1 - sstep(0.85, 0.99, u)); } });

    const harp = id === 'harpun';
    return Object.assign(base, { T: harp ? 6.5 : 6.0, bakeAt: harp ? 0.8 : 0.84, textIn: 0.86,
      world: function (u) {

        W.shake = harp ? (u > 0.5 && u < 0.62 ? 9 : 2.5 * Math.sin(u * Math.PI)) : 2 + 6 * sstep(0.3, 0.75, u);

      shade: function (u) { return sstep(0.02, 0.12, u) * (1 - sstep(0.9, 0.99, u)); },

  return Object.assign(base, { T: 7.5, bakeAt: 0.3, textIn: 0.84,
    finalPose: function () { return Object.assign({}, POSES.dawn); },
    world: function (u) { if (u > 0.22) W.dawn = sstep(0.22, 0.5, u); },
    pose: function (u, p0, c) { if (u < 0.22) { Object.assign(c, p0); c.pitch = p0.pitch + u * 0.3; } else { const k = easeIO((u - 0.22) / 0.78); const d = POSES.dawn; c.x = lerp(d.x - 6, d.x, k); c.y = lerp(d.y + 5, d.y, k); c.z = lerp(d.z - 8, d.z, k); c.yaw = d.yaw - 0.25 * (1 - k); c.pitch = d.pitch - 0.1 * (1 - k); } },
